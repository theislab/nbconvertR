name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # check-r-package runs tests but without LaTeX installed (that’s tested below in the test job)
  check:
    name: check (${{ matrix.config.os }}, R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install nbconvert
        run: python -m pip install --upgrade jupyter nbconvert

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install nbconvert
        run: python -m pip install --upgrade jupyter nbconvert

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texinfo \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-plain-generic

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, local::.
          needs: test

      # load_package = 'installed' matches how R CMD check runs the suite, so
      # the vignette engine registered in .onLoad() is found the same way.
      - name: Run tests
        run: testthat::test_local(load_package = 'installed', reporter = 'progress')
        shell: Rscript {0}

  all-green:
    name: all green
    if: always()
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Merge check & test results into one status
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
